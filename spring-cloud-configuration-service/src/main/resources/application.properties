# Modernized for Java 21 & Spring Boot 3.5.16 Baseline
spring.application.name=spring-cloud-configuration-service
server.port=8888
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:///${user.dir}/config-files-all

management.endpoints.web.exposure.include=*
management.endpoints.access.default=unrestricted

logging.level.org.springframework.cloud=trace